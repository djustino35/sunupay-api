name: 03 - SCA et SBOM
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  dependances:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: SBOM (CycloneDX)
        run: pip-audit -r requirements.txt --no-deps -f cyclonedx-json -o sbom.json || true
      - name: pip-audit (echoue si une dependance est vulnerable)
        run: pip-audit -r requirements.txt --no-deps
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom
          path: sbom.json
