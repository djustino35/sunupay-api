name: 01 - Detection de secrets
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tout l'historique : un secret supprime reste dans Git
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --redact --verbose \
            --report-format json --report-path /repo/gitleaks.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-secrets
          path: gitleaks.json
